name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm check:package
      - name: Pack the installable npm tarball
        run: mkdir -p artifacts && pnpm pack --pack-destination artifacts
      - name: Install pinned DSH CLI
        run: npm install --global @deepseek-ai/dsh@0.1.0-rc.7
      - name: Mount the packed plugin in a clean Web profile
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: |
          dsh plugin --profile web add ./artifacts/*.tgz
          dsh --profile web --dump-config > "${RUNNER_TEMP}/dsh-config.yml"
          grep -F -- '# == dsh-prompt-enhancement' "${RUNNER_TEMP}/dsh-config.yml"
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-prompt-enhancement-${{ github.sha }}
          path: artifacts/*.tgz
          if-no-files-found: error
