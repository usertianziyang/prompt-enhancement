name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm check:package
      - name: Pack release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          mkdir -p artifacts
          pnpm pack --pack-destination artifacts
          git archive --format=tar.gz --prefix="${PACKAGE_NAME}-${RELEASE_TAG}-source/" --output="artifacts/${PACKAGE_NAME}-${RELEASE_TAG}-source.tar.gz" "${RELEASE_TAG}"
          node scripts/release.mjs --notes "${RELEASE_TAG}" > release-notes.md
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" --title "${RELEASE_TAG}" --notes-file release-notes.md --verify-tag
          fi
          gh release upload "${RELEASE_TAG}" artifacts/* --clobber
      - name: Publish to npm with provenance
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          if npm view "${PACKAGE_NAME}@${RELEASE_VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${RELEASE_VERSION} is already published; skipping"
          else
            npm publish --provenance --access public
          fi
